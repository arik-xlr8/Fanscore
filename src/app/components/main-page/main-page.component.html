<div class="main-wrapper">
  <section class="heatmap-wrap" (scroll)="onHeatmapScroll($event)">
    <div class="heatmap-filters">
      <div class="view-mode-switch">
        <button
          type="button"
          class="filter-btn"
          [class.filter-btn--active]="selectedMode === 'trends' && !searchTerm.trim()"
          (click)="selectMode('trends')"
        >
          Trendler
        </button>

        <button
          type="button"
          class="filter-btn"
          [class.filter-btn--active]="selectedMode === 'shuffle' && !searchTerm.trim()"
          (click)="selectMode('shuffle')"
        >
          Karıştır
        </button>
      </div>

      <div style="color: green;">
        |
      </div>

      <button
        type="button"
        class="filter-btn"
        *ngFor="let period of periods"
        [class.filter-btn--active]="selectedPeriod === period.key"
        (click)="selectPeriod(period.key)"
      >
        {{ period.label }}
      </button>

      <div class="top-tools">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>

          <div style="position: relative;">
            <input
              type="text"
              class="search-input"
              placeholder="Oyuncu veya takım ara..."
              [value]="searchTerm"
              (input)="onSearchInput($event)"
            />

            <i class="fa-solid fa-magnifying-glass"></i>
          </div>

          <button
            *ngIf="searchTerm"
            type="button"
            class="clear-search-btn"
            (click)="clearSearch()"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="heatmap">
      <div
        class="tile"
        *ngFor="let player of players; trackBy: trackById"
        [routerLink]="['/player', player.id]"
        [queryParams]="{ period: selectedPeriod }"
        [ngStyle]="{
          'background-image': getBackgroundImage(player.ppUrl),
          'background-size': 'contain',
          'background-position': 'center',
          'background-repeat': 'no-repeat',
          'box-shadow': 'inset 0 0 0 6px ' + getBorderColor(player.change),
          'grid-column': 'span ' + getSizeByChange(player.change).col,
          'grid-row': 'span ' + getSizeByChange(player.change).row
        }"
        (click)="selectPlayer(player)"
      >
        <div class="tile-top">
          <div class="badge">{{ player.team }}</div>

          <div [class]="getChangeClass(player.change)">
            {{ formatChange(player.change) }}
          </div>
        </div>

        <div class="tile-bottom">
          <div class="player-specs">
            <div class="name">{{ player.name }}</div>

            <div class="sub">
              <span>{{ formatAverageRating(player.averageRating) }} €</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="loading" *ngIf="isLoading">
      Yükleniyor...
    </div>

    <div class="end" *ngIf="isEnd && !isLoading && players.length > 0">
      Hepsi bu kadar.
    </div>

    <div class="end" *ngIf="isEnd && !isLoading && players.length === 0">
      Sonuç bulunamadı.
    </div>
  </section>
</div>
