<div class="rating-panel">
  <div
    class="message-popup"
    *ngIf="showMessagePopup"
    [class.message-popup--success]="popupType === 'success'"
    [class.message-popup--error]="popupType === 'error'"
  >
    <div class="message-popup__content">
      <div class="message-popup__title">
        {{ popupType === 'success' ? 'Başarılı' : 'Uyarı' }}
      </div>

      <div class="message-popup__text">
        {{ popupMessage }}
      </div>
    </div>

    <button
      type="button"
      class="message-popup__close"
      (click)="closeMessagePopup()"
      aria-label="Mesajı kapat"
    >
      ×
    </button>
  </div>

  <div class="rating-panel__header">
    <h3 class="rating-panel__title">Fiyat Tahmini Yap</h3>

    <p class="rating-panel__subtitle">
      Oyuncunun piyasa değeri seçtiğiniz zaman aralığında kaç milyon € eder?
    </p>
  </div>

  <div class="rating-panel__body">
    <div class="form-group">
      <label for="periodType">Zaman Aralığı (Geçtiğimiz)</label>

      <select
        id="periodType"
        class="input"
        [ngModel]="selectedPeriod"
        (ngModelChange)="onPeriodChange($event)"
      >
        <option *ngFor="let period of periods" [ngValue]="period.key">
          {{ period.label }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="ratingValue">Değer (€)</label>

      <input
        id="ratingValue"
        type="number"
        class="input"
        min="0"
        max="300"
        step="0.1"
        [(ngModel)]="ratingValue"
        (blur)="clampRating()"
        placeholder="Milyondan küçük değerler için ondalıklı girebilirsiniz Örn: 0.5"
      />
    </div>

    <div class="form-group">
      <label for="comment">Yorum (opsiyonel)</label>

      <textarea
        id="comment"
        class="input textarea"
        rows="4"
        [(ngModel)]="comment"
        placeholder="Kısa bir yorum yazabilirsin"
      ></textarea>
    </div>

    <div class="vote-info">
      <div class="vote-info__message">
        {{ availabilityMessage }}
      </div>

      <div class="vote-info__message" *ngIf="nextAvailableText">
        {{ nextAvailableText }}
      </div>
    </div>
  </div>

  <div class="rating-panel__footer">
    <button
      type="button"
      class="btn btn--secondary"
      (click)="closePanel()"
    >
      İptal
    </button>

    <button
      type="button"
      class="btn btn--primary"
      [disabled]="isSubmitting || isCheckingAvailability"
      (click)="submitVote()"
    >
      {{ isSubmitting ? 'Gönderiliyor...' : 'Oyu Gönder' }}
    </button>
  </div>
</div>
